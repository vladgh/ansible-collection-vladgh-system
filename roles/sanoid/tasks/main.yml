---
- name: Validate Syncoid jobs
  ansible.builtin.assert:
    that:
      - >-
        item.on_calendar | default('') | regex_search('[\r\n]') is none
      - item.name is match('^[a-zA-Z0-9_][a-zA-Z0-9_-]*$')
      - >-
        item.state | default('present') == 'absent' or
        (item.source | default('') | length > 0 and
        item.destination | default('') | length > 0 and
        item.on_calendar | default('') | length > 0)
    fail_msg: >-
      Use a safe unique job name and supply source, destination, and
      on_calendar for present jobs.
  loop: "{{ sanoid_syncoid_jobs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate schedules and unique job names
  ansible.builtin.assert:
    that:
      - sanoid_on_calendar | length > 0
      - sanoid_on_calendar | regex_search('[\r\n]') is none
      - >-
        sanoid_syncoid_jobs | map(attribute='name') | unique | length ==
        sanoid_syncoid_jobs | length
    fail_msg: Supply a snapshot schedule and unique Syncoid job names.

- name: Install Sanoid dependencies
  ansible.builtin.apt:
    name:
      - libconfig-inifiles-perl
      - libcapture-tiny-perl
      - mbuffer
      - lzop
      - pv
    state: present

- name: Create Sanoid Directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /usr/local/bin
    - /etc/sanoid

- name: Install binaries
  ansible.builtin.get_url:
    url: >-
      https://raw.githubusercontent.com/jimsalterjrs/sanoid/{{
      sanoid_version }}/{{ item }}
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: [sanoid, syncoid, findoid]

- name: Configure Sanoid snapshots
  ansible.builtin.import_tasks: sanoid.yml

- name: Configure Syncoid jobs
  ansible.builtin.include_tasks: syncoid.yml
  loop: "{{ sanoid_syncoid_jobs }}"
  loop_control:
    loop_var: sanoid_job
    label: "{{ sanoid_job.name }}"
