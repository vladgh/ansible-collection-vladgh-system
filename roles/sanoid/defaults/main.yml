---
# renovate: datasource=github-tags depName=jimsalterjrs/sanoid
sanoid_version: v2.3.0

# Snapshot scheduling is independent of replication jobs.
sanoid_enabled: true
sanoid_on_calendar: '*:0/15'
sanoid_syncoid_jobs: []

sanoid_templates:
  default:
    frequently: 4
    hourly: 24
    daily: 7
    monthly: 12
    yearly: 1
    autosnap: true
    autoprune: true
sanoid_datasets: {}
