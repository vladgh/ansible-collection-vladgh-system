---
argument_specs:
  main:
    short_description: Check host storage and report its state to Uptime Kuma
    options:
      zfs_pool_monitor_capacity_warning:
        type: int
        default: 80
      zfs_pool_monitor_capacity_critical:
        type: int
        default: 90
      zfs_pool_monitor_capacity_delay:
        type: int
        default: 3600
      zfs_pool_monitor_scrub_max_age:
        type: int
        default: 3888000
      zfs_pool_monitor_on_calendar:
        type: str
        default: '*-*-* *:00/5:00'
      zfs_pool_monitor_jobs:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
          pools:
            type: list
            elements: str
            required: true
          kuma_url:
            type: str
            required: true
          on_calendar:
            type: str
          enabled:
            type: bool
            default: true
