---
argument_specs:
  main:
    short_description: Caddy
    options:
      caddy_version:
        type: str
        default: 2.11.9
      caddy_cloudflare_version:
        type: str
        default: v0.2.4
      caddy_arch:
        type: str
      caddy_user:
        type: str
        default: caddy
      caddy_cloudflare_api_token:
        type: str
        default: ''
      caddy_sites:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
          upstream:
            type: str
            required: true
