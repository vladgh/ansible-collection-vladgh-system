---
- name: Validate backup credentials and destination
  ansible.builtin.assert:
    that:
      - semaphore_backup_destination | length > 0
      - semaphore_backup_ssh_private_key | length > 0
    fail_msg: Supply a backup destination and SSH private key through inventory.
  no_log: true
  diff: false

# ------------------------
# Dependencies
# ------------------------
- name: Ensure rsync is installed
  ansible.builtin.apt:
    name: rsync
    state: present

# ------------------------
# SSH key for the backup destination
# ------------------------
- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: semaphore_backup_ssh_private_key | length > 0

# Key material is sensitive, so its content must never appear in logs/output
- name: Install Semaphore backup SSH private key
  ansible.builtin.copy:
    content: "{{ semaphore_backup_ssh_private_key }}"
    dest: "{{ semaphore_backup_ssh_key_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  when: semaphore_backup_ssh_private_key | length > 0

# ------------------------
# Backup script
# ------------------------
- name: Install Semaphore backup script
  ansible.builtin.template:
    src: semaphore-backup.sh.j2
    dest: "{{ semaphore_backup_script_path }}"
    owner: root
    group: root
    mode: '0750'

# ------------------------
# Systemd service & timer
# ------------------------
- name: Install Semaphore backup systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/semaphore-backup.service
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible. Local changes will be overwritten.

      [Unit]
      Description=Backup Semaphore data to {{ semaphore_backup_destination }}
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart={{ semaphore_backup_script_path }}
  notify:
    - Reload SystemD

- name: Install Semaphore backup systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/semaphore-backup.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible. Local changes will be overwritten.

      [Unit]
      Description=Schedule Semaphore backup

      [Timer]
      OnCalendar={{ semaphore_backup_schedule }}
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify:
    - Reload SystemD

- name: Apply pending systemd unit changes
  ansible.builtin.meta: flush_handlers

# Toggling semaphore_backup_enabled off cleanly removes the schedule again
- name: Enable and start Semaphore backup timer
  ansible.builtin.systemd:
    name: semaphore-backup.timer
    state: started
    enabled: true
  when: semaphore_backup_enabled | bool

- name: Disable and stop Semaphore backup timer
  ansible.builtin.systemd:
    name: semaphore-backup.timer
    state: stopped
    enabled: false
  when: not semaphore_backup_enabled | bool
