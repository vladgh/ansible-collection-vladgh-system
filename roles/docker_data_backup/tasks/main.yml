---
- name: Validate backup credentials and destination
  ansible.builtin.assert:
    that:
      - docker_data_backup_destination | length > 0
      - docker_data_backup_ssh_private_key | length > 0
    fail_msg: Supply a backup destination and SSH private key through inventory.
  no_log: true
  diff: false

- name: Ensure rsync is installed
  ansible.builtin.package:
    name: rsync
    state: present

- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

# Key material is sensitive, so its content must never appear in logs/output
- name: Install backup SSH private key
  ansible.builtin.copy:
    content: "{{ docker_data_backup_ssh_private_key | trim }}\n"
    dest: "{{ docker_data_backup_ssh_key_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false

- name: Install backup script
  ansible.builtin.template:
    src: docker-data-backup.sh.j2
    dest: "{{ docker_data_backup_script_path }}"
    owner: root
    group: root
    mode: '0750'

- name: Install backup systemd service
  ansible.builtin.template:
    src: docker-data-backup.service.j2
    dest: /etc/systemd/system/docker-data-backup.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload SystemD

- name: Install backup systemd timer
  ansible.builtin.template:
    src: docker-data-backup.timer.j2
    dest: /etc/systemd/system/docker-data-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload SystemD

- name: Flush handlers so systemd sees the new units
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: docker-data-backup.timer
    state: started
    enabled: true
  when: docker_data_backup_enabled | bool

- name: Disable and stop backup timer
  ansible.builtin.systemd:
    name: docker-data-backup.timer
    state: stopped
    enabled: false
  when: not docker_data_backup_enabled | bool
