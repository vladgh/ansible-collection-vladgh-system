---
argument_specs:
  main:
    short_description: Docker data backup
    options:
      docker_data_backup_enabled:
        type: bool
        default: true
      docker_data_backup_source:
        type: str
        default: /opt/appdata/
      docker_data_backup_compose_root:
        type: str
        default: /opt/appstack
      docker_data_backup_schedule:
        type: str
        default: '*-*-* 03:33:33'
      docker_data_backup_stop_timeout:
        type: int
        default: 60
      docker_data_backup_ssh_timeout:
        type: int
        default: 30
      docker_data_backup_rsync_opts:
        type: list
        elements: str
        default:
          - -aH
          - --delete
          - --numeric-ids
      docker_data_backup_script_path:
        type: str
        default: /usr/local/bin/docker-data-backup
      docker_data_backup_ssh_key_path:
        type: str
        default: /root/.ssh/id_ed25519_docker_data_backup
      docker_data_backup_destination:
        type: str
        required: true
      docker_data_backup_ssh_private_key:
        type: str
        required: true
