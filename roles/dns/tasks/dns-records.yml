---
- name: Require Cloudflare credentials
  ansible.builtin.assert:
    that: >
      (cloudflare_api_token | default('') | length > 0) or
      (cloudflare_account_email | default('') | length > 0 and
       cloudflare_account_api_key | default('') | length > 0)
    fail_msg: Set cloudflare_api_token, or cloudflare_account_email plus cloudflare_account_api_key
  run_once: true

- name: Provision DNS records
  community.general.cloudflare_dns:
    state: "{{ item.state | default('present') }}"
    zone: "{{ item.zone }}"
    type: "{{ item.type }}"
    record: "{{ item.record }}"
    value: "{{ item.value }}"
    proxied: "{{ item.proxied | default(omit) }}"
    account_email: "{{ cloudflare_account_email | default(omit) }}"
    account_api_key: "{{ cloudflare_account_api_key | default(omit) }}"
    api_token: "{{ cloudflare_api_token | default(omit) }}"
  delegate_to: localhost
  run_once: true
  loop: "{{ cloudflare_dns_records }}"
