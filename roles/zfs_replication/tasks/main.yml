---
- name: Validate ZFS replication settings
  ansible.builtin.assert:
    that:
      - zfs_replication_user | length > 0
      - zfs_replication_host | length > 0
      - zfs_replication_source_dataset | length > 0
      - zfs_replication_destination_dataset | length > 0
      - zfs_replication_on_calendar | length > 0
    fail_msg: >-
      Set non-empty ZFS replication connection, dataset, and schedule values

- name: Ensure APT cache is up to date
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: zfs_replication_apt_cache
  until: zfs_replication_apt_cache is success
  retries: 3
  delay: 2

- name: Install runtime dependencies for Syncoid
  ansible.builtin.apt:
    name: "{{ zfs_replication_packages }}"
    state: present
  register: zfs_replication_packages_install
  until: zfs_replication_packages_install is success
  retries: 3
  delay: 2

- name: Ensure /usr/local/bin exists
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Syncoid
  ansible.builtin.get_url:
    url: "{{ zfs_replication_syncoid_url }}"
    dest: "{{ zfs_replication_syncoid_path }}"
    mode: '0755'
    owner: root
    group: root
  register: zfs_replication_syncoid_download
  until: zfs_replication_syncoid_download is success
  retries: 3
  delay: 2

# The shared lock prevents overlapping runs on this host.
- name: Install ZFS replication service unit
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. Local changes will be overwritten.

      [Unit]
      Description=ZFS replication
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      User=root
      ExecStart=/usr/bin/flock -xn /var/run/zfs-replication.lock \
        {{ zfs_replication_syncoid_path | replace('%', '%%') | to_json }} \
        {{ zfs_replication_source_dataset | replace('%', '%%') | to_json }} \
        {{ zfs_replication_remote_target | replace('%', '%%') | to_json }}
    dest: /etc/systemd/system/zfs-replication.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload SystemD

# Skip missed runs when offline, preserving the former cron behavior.
- name: Install ZFS replication timer unit
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. Local changes will be overwritten.

      [Unit]
      Description=Scheduled ZFS replication

      [Timer]
      OnCalendar={{ zfs_replication_on_calendar }}
      Persistent=false
      Unit=zfs-replication.service

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/zfs-replication.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload SystemD

- name: Apply pending systemd unit changes
  ansible.builtin.meta: flush_handlers

# Keep unit files when pausing the timer.
- name: Enable and start ZFS replication timer
  ansible.builtin.systemd_service:
    name: zfs-replication.timer
    enabled: true
    state: started
  when: zfs_replication_enabled | bool

- name: Disable and stop ZFS replication timer
  ansible.builtin.systemd_service:
    name: zfs-replication.timer
    enabled: false
    state: stopped
  when: not zfs_replication_enabled | bool
