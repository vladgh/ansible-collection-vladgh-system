---
argument_specs:
  main:
    short_description: Configure a scheduled Syncoid ZFS replication job
    options:
      zfs_replication_enabled:
        type: bool
        default: true
      zfs_replication_sanoid_version:
        type: str
        default: v2.3.0
      zfs_replication_user:
        type: str
        required: true
      zfs_replication_host:
        type: str
        required: true
      zfs_replication_source_dataset:
        type: str
        required: true
      zfs_replication_destination_dataset:
        type: str
        required: true
      zfs_replication_on_calendar:
        type: str
        required: true
