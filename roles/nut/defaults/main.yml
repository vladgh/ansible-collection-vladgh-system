---
# Mode
nut_mode: none  # none, standalone, netserver or netclient

# Server
nut_driver: usbhid-ups
nut_port: auto
nut_ups_description: UPS
nut_ups_ignorelb: false
nut_ups_override_battery_charge_low: 25
nut_ups_override_battery_runtime_low: 300
nut_ups_extra: |
  maxretry = 3
nut_upsd_extra: |
  LISTEN 0.0.0.0 3493
nut_upsd_users:
  admin:
    password: changeme
    actions: SET FSD
    instcmds: ALL
  monitor:
    password: changeme
    upsmon: master
  client:
    password: changeme
    upsmon: slave

# Client
nut_host: ups@localhost
nut_user: monitor
nut_password: changeme
nut_role: slave
nut_powervalue: 1

# Extra upsmon.conf directives rendered as "KEY value", for example
# POLLFREQ: 5, DEADTIME: 15, FINALDELAY: 5, MINSUPPLIES: 1
nut_upsmon_settings: {}

# Notifications (disabled by default)
nut_notify_events:
  - ONBATT
  - ONLINE
  - LOWBATT
  - FSD
  - COMMBAD
  - COMMOK
  - SHUTDOWN
  - REPLBATT
# Per-event NOTIFYFLAG overrides, for example ONBATT: SYSLOG+WALL
nut_upsmon_notifyflags: {}

nut_notify_email_enabled: false
# nut_notify_email_to: ops@example.com
nut_notify_email_subject_prefix: UPS

nut_notify_telegram_enabled: false
# nut_telegram_chat_id: "123456789"
# nut_telegram_bot_token: "{{ vault_nut_telegram_bot_token }}"
