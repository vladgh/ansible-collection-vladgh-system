---
- name: Ensure NUT Server Package
  ansible.builtin.package:
    name: nut-server
    state: present

- name: Generate NUT Configuration Files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: "0640"
  notify:
    - Restart NUT Server
  loop:
    - ups.conf
    - upsd.conf

- name: Generate NUT User Configuration
  ansible.builtin.template:
    src: upsd.users.j2
    dest: /etc/nut/upsd.users
    owner: root
    group: nut
    mode: "0640"
  no_log: true
  notify:
    - Restart NUT Server
