---

- name: Gather package facts for prerequisite checks
  ansible.builtin.package_facts:
    manager: auto
  when: nut_notify_telegram_enabled | bool

- name: Require curl for Telegram notifications
  ansible.builtin.assert:
    that:
      - "'curl' in ansible_facts.packages"
    fail_msg: >-
      nut_notify_telegram_enabled is true but curl is not installed.
      Install curl on the host (or disable Telegram notifications).
    quiet: true
  when: nut_notify_telegram_enabled | bool

- name: Require Telegram settings
  ansible.builtin.assert:
    that:
      - nut_telegram_chat_id is defined
      - nut_telegram_bot_token is defined
    fail_msg: nut_telegram_chat_id and nut_telegram_bot_token are required when Telegram notifications are enabled.
  when: nut_notify_telegram_enabled | bool

- name: Require mail support for email notifications
  ansible.builtin.assert:
    that:
      - nut_notify_email_to is defined
      - nut_notify_email_to | length > 0
    fail_msg: >-
      nut_notify_email_enabled is true but nut_notify_email_to is missing.
    quiet: true
  when: nut_notify_email_enabled | bool

- name: Generate Configuration Directory
  ansible.builtin.file:
    path: /etc/nut
    state: directory
    mode: '0755'

- name: Generate Server Configuration
  ansible.builtin.import_tasks: server.yml
  when: >
    nut_mode is defined and
    (
      nut_mode == 'netserver' or
      nut_mode == 'standalone'
    )

- name: Generate Client Configuration
  ansible.builtin.import_tasks: client.yml
  when: >
    nut_mode is defined and
    (
      nut_mode == 'netserver' or
      nut_mode == 'standalone' or
      nut_mode == 'netclient'
    )

- name: Generate NUT Mode Configuration
  ansible.builtin.template:
    src: nut.conf.j2
    dest: /etc/nut/nut.conf
    owner: root
    group: nut
    mode: '0640'
  notify:
    - Restart NUT Server
    - Restart NUT Client

- name: Service State
  ansible.builtin.import_tasks: state.yml
