---
- name: Require notification recipients
  ansible.builtin.assert:
    that:
      - not nut_notify_email_enabled | bool or (nut_notify_email_to | default('') | length > 0)
      - not nut_notify_telegram_enabled | bool or (nut_telegram_chat_id | default('') | length > 0)
      - not nut_notify_telegram_enabled | bool or (nut_telegram_bot_token | default('') | length > 0)
    fail_msg: >-
      Set nut_notify_email_to when email is enabled, and nut_telegram_chat_id
      plus nut_telegram_bot_token when Telegram is enabled

- name: Ensure NUT Client Package
  ansible.builtin.package:
    name: nut-client
    state: present

- name: Gather package facts for Telegram prerequisite check
  ansible.builtin.package_facts:
  when: nut_notify_telegram_enabled | bool

- name: Require curl for Telegram notifications
  ansible.builtin.assert:
    that: "'curl' in ansible_facts['packages']"
    fail_msg: Install curl before enabling Telegram notifications
  when: nut_notify_telegram_enabled | bool

- name: Generate NUT Configuration Files
  ansible.builtin.template:
    src: upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: nut
    mode: "0640"
  no_log: true
  notify: Restart NUT Client

- name: Generate NUT Notification Script
  ansible.builtin.template:
    src: notifycmd.j2
    dest: /etc/nut/notifycmd
    owner: root
    group: nut
    mode: "0750"
  when: __nut_notify_enabled | bool

- name: Generate NUT Telegram Credentials
  ansible.builtin.template:
    src: telegram.env.j2
    dest: /etc/nut/telegram.env
    owner: root
    group: nut
    mode: "0640"
  no_log: true
  when: nut_notify_telegram_enabled | bool

- name: Remove NUT Notification Script
  ansible.builtin.file:
    path: /etc/nut/notifycmd
    state: absent
  when: not __nut_notify_enabled | bool

- name: Remove NUT Telegram Credentials
  ansible.builtin.file:
    path: /etc/nut/telegram.env
    state: absent
  when: not nut_notify_telegram_enabled | bool
