---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Include docker_data_backup role
      ansible.builtin.include_role:
        name: vladgh.system.docker_data_backup
      vars:
        docker_data_backup_destination: backup@backup.example.org:/srv/backup/
        docker_data_backup_ssh_private_key: molecule-inert-test-key-not-for-authentication
        docker_data_backup_enabled: false
