---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Include semaphore_backup role
      ansible.builtin.include_role:
        name: vladgh.system.semaphore_backup
      vars:
        semaphore_backup_destination: backup@backup.example.org:/srv/semaphore/
        semaphore_backup_ssh_private_key: molecule-inert-test-key-not-for-authentication
        semaphore_backup_enabled: false
