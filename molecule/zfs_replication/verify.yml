---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Inspect installed files
      ansible.builtin.stat:
        path: '{{ item.path }}'
      loop:
        - path: /etc/systemd/system/zfs-replication.service
          mode: '0644'
      register: installed_files
    - name: Verify installed files and permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == item.item.mode
      loop: '{{ installed_files.results }}'
      loop_control:
        label: '{{ item.item.path }}'
    - name: Read timer enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - zfs-replication.timer
      register: timer_enabled
      changed_when: false
      failed_when: timer_enabled.rc not in [0, 1]
    - name: Verify timer enablement
      ansible.builtin.assert:
        that:
          - timer_enabled.stdout == 'disabled'
    - name: Read installed configuration
      ansible.builtin.slurp:
        src: /etc/systemd/system/zfs-replication.service
      register: installed_config
    - name: Verify installed configuration
      ansible.builtin.assert:
        that:
          - '''flock -xn'' in (installed_config.content | b64decode)'
          - '''backup@backup.example.org:backup/documents'' in (installed_config.content | b64decode)'
