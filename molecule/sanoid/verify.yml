---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Inspect installed replication key
      ansible.builtin.stat:
        path: /root/.ssh/syncoid
        checksum_algorithm: sha256
      register: replication_key

    - name: Inspect replication key directory
      ansible.builtin.stat:
        path: /root/.ssh
      register: replication_key_directory

    - name: Check replication key contents and permissions
      ansible.builtin.assert:
        that:
          - replication_key.stat.isreg
          - replication_key.stat.uid == 0
          - replication_key.stat.gid == 0
          - replication_key.stat.mode == '0600'
          - >-
            replication_key.stat.checksum ==
            ('molecule-test-key-not-a-real-credential' | hash('sha256'))
          - replication_key_directory.stat.mode == '0700'

    - name: Read Sanoid configuration
      ansible.builtin.slurp:
        src: /etc/sanoid/sanoid.conf
      register: snapshot_config

    - name: Check snapshot policy rendering
      ansible.builtin.assert:
        that:
          - "'[tank/dataset]' in (snapshot_config.content | b64decode)"
          - "'autosnap = true' in (snapshot_config.content | b64decode)"

    - name: Read replication timer enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item.name }}"
      loop:
        - name: syncoid-documents.timer
          expected: enabled
        - name: syncoid-paused.timer
          expected: disabled
      register: replication_timers
      changed_when: false
      failed_when: replication_timers.rc not in [0, 1]

    - name: Check replication timer enablement
      ansible.builtin.assert:
        that:
          - item.stdout == item.item.expected
      loop: "{{ replication_timers.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Inspect removed replication units
      ansible.builtin.stat:
        path: "/etc/systemd/system/syncoid-removed.{{ item }}"
      loop: [service, timer]
      register: removed_units

    - name: Check replication units were removed
      ansible.builtin.assert:
        that:
          - not item.stat.exists
      loop: "{{ removed_units.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read replication service
      ansible.builtin.slurp:
        src: /etc/systemd/system/syncoid-documents.service
      register: replication_service

    - name: Check replication arguments and locking
      vars:
        replication_unit: "{{ replication_service.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - >-
            '/usr/bin/flock /run/syncoid.lock' in replication_unit
          - "'\"--recursive\"' in replication_unit"
          - >-
            '"backup@backup.example.org:backup/dataset"' in replication_unit
