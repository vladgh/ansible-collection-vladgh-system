---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Include sanoid role
      ansible.builtin.include_role:
        name: vladgh.system.sanoid
      vars:
        sanoid_syncoid_ssh_private_key: molecule-test-key-not-a-real-credential
        sanoid_templates:
          default:
            frequently: 4
            hourly: 24
            daily: 7
            monthly: 12
            yearly: 1
            autosnap: true
            autoprune: true
        sanoid_datasets:
          tank/dataset:
            use_template: default
        sanoid_syncoid_jobs:
          - name: documents
            source: tank/dataset
            destination: backup@backup.example.org:backup/dataset
            options: [--recursive]
            on_calendar: hourly
          - name: paused
            source: tank/archive
            destination: backup/archive
            on_calendar: daily
            enabled: false
          - name: removed
            state: absent
