---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Require a supported test platform running systemd
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts['distribution'] == 'Ubuntu' and
             ansible_facts['distribution_version'] in ['26.04', '26.10']) or
            (ansible_facts['distribution'] == 'Debian' and
             ansible_facts['distribution_major_version'] == '13')
          - ansible_facts['service_mgr'] == 'systemd'
        fail_msg: >-
          Use Ubuntu 26.04, Ubuntu 26.10, or Debian 13 with systemd as PID 1.

    # systemd_service does not expose the overall system initialization state.
    - name: Wait for systemd initialization  # noqa: command-instead-of-module
      ansible.builtin.command:
        argv:
          - systemctl
          - is-system-running
      register: systemctl_status
      until: systemctl_status.stdout in ['running', 'degraded']
      retries: 30
      delay: 5
      changed_when: false
      failed_when: systemctl_status.rc > 1
      check_mode: false

    - name: Install shared test prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - iproute2
          - sudo
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 600
