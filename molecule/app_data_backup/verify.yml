---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Inspect installed files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - path: /usr/local/bin/app-data-backup-local
          mode: '0750'
        - path: /usr/local/bin/app-data-backup-remote-compose
          mode: '0750'
        - path: /etc/systemd/system/app-data-backup-local.service
          mode: '0644'
        - path: /root/.ssh/id_ed25519_app_data_backup
          mode: '0600'
      register: installed_files

    - name: Verify permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == item.item.mode
      loop: "{{ installed_files.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Check rendered script syntax
      ansible.builtin.command:
        argv: [/bin/bash, -n, "{{ item }}"]
      loop:
        - /usr/local/bin/app-data-backup-local
        - /usr/local/bin/app-data-backup-remote-compose
      changed_when: false

    - name: Read timer enablement
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "app-data-backup-{{ item }}.timer"]
      loop: [local, remote-compose]
      register: timers
      changed_when: false
      failed_when: timers.rc not in [0, 1]

    - name: Verify timer states
      ansible.builtin.assert:
        that:
          - timers.results[0].stdout == 'enabled'
          - timers.results[1].stdout == 'disabled'

    - name: Validate systemd units
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/app-data-backup-local.service
          - /etc/systemd/system/app-data-backup-local.timer
      changed_when: false

    - name: Start fixture service
      ansible.builtin.systemd_service:
        name: app-data-backup-fixture.service
        state: started

    - name: Run local backup twice
      ansible.builtin.systemd_service:
        name: app-data-backup-local.service
        state: started
      loop: [first, repeat]

    - name: Read copied data
      ansible.builtin.slurp:
        src: /srv/backup test/destination/data.txt
      register: copied_data

    - name: Check successful backup marker
      ansible.builtin.stat:
        path: /var/lib/app-data-backup/local.success
      register: success_marker

    - name: Read fixture service state
      ansible.builtin.command:
        argv: [systemctl, is-active, app-data-backup-fixture.service]
      changed_when: false
      register: fixture_state

    - name: Verify copy and recovery
      ansible.builtin.assert:
        that:
          - copied_data.content | b64decode == 'backup fixture\n'
          - success_marker.stat.exists
          - fixture_state.stdout == 'active'
