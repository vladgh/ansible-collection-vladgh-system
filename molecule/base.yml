---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: "${MOLECULE_IMAGE:-ubuntu:26.04}"
    dockerfile: ../Dockerfile.j2
    command: /sbin/init
    cgroupns_mode: host
    privileged: true
    pre_build_image: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp

provisioner:
  playbooks:
    prepare: ../prepare.yml
