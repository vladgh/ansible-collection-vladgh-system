---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Inspect installed files
      ansible.builtin.stat:
        path: '{{ item.path }}'
      loop:
        - path: /etc/zfs-replication-monitor/documents.env
          mode: '0600'
        - path: /etc/systemd/system/zfs-replication-monitor-documents.service
          mode: '0644'
      register: installed_files
    - name: Verify installed files and permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == item.item.mode
      loop: '{{ installed_files.results }}'
      loop_control:
        label: '{{ item.item.path }}'
    - name: Read timer enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - zfs-replication-monitor-documents.timer
      register: timer_enabled
      changed_when: false
      failed_when: timer_enabled.rc not in [0, 1]
    - name: Verify timer enablement
      ansible.builtin.assert:
        that:
          - timer_enabled.stdout == 'enabled'
    - name: Read installed configuration
      ansible.builtin.slurp:
        src: /etc/systemd/system/zfs-replication-monitor-documents.service
      register: installed_config
    - name: Verify installed configuration
      ansible.builtin.assert:
        that:
          - '''EnvironmentFile=/etc/zfs-replication-monitor/documents.env'' in (installed_config.content
            | b64decode)'
          - '''https://'' not in (installed_config.content | b64decode)'
          - '''molecule-test'' not in (installed_config.content | b64decode)'
    - name: Check installed script syntax
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -n
          - /usr/local/bin/zfs-replication-monitor
      changed_when: false
